[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "diskaudit"
version = "1.1.1"
description = "Auditoria de disco determinística a partir de CSV do WinDirStat — dashboard HTML com plano de ação por risco."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Guilherme Roesler" }]
keywords = ["disk", "audit", "windirstat", "dashboard", "cleanup", "windows"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "pandas>=2.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "coverage>=7.0",
    "mypy>=1.8",
    "pre-commit>=3.5",
]

[project.urls]
Homepage = "https://github.com/GuilhermeRoesler/DiskAudit"
Documentation = "https://guilhermeroesler.github.io/DiskAudit/"
Repository = "https://github.com/GuilhermeRoesler/DiskAudit"
Issues = "https://github.com/GuilhermeRoesler/DiskAudit/issues"
Changelog = "https://github.com/GuilhermeRoesler/DiskAudit/blob/main/CHANGELOG.md"

[project.scripts]
disk-audit = "diskaudit.cli:main"

[tool.setuptools.packages.find]
include = ["diskaudit*"]

[tool.setuptools.package-data]
diskaudit = ["templates/*.html", "static/*", "py.typed"]

[tool.setuptools]
py-modules = ["disk_audit"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
packages = ["diskaudit"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
disable_error_code = ["import-untyped"]

[tool.coverage.run]
source = ["diskaudit"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 70
